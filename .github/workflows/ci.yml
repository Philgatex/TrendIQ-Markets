name: CI

on:
  push:
    branches: [ main, add-ci-smoke-test ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run import smoke test
        run: |
          python tests/import_test.py
      - name: Run provider tests (skip gracefully if optional deps missing)
        run: |
          python tests/providers_test.py || true
      - name: Run Binance & MT5 tests (safe, non-destructive)
        run: |
          python tests/binance_test.py || true
          python tests/mt5_order_test.py || true
      - name: Install linters
        run: |
          pip install flake8 black
      - name: Run flake8
        run: |
          flake8
